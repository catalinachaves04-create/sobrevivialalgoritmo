<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elige tu propia aventura: sobreviví al algoritmo</title>
<style>
:root {
  --bg: #efe0c8;
  --panel: #fbf3e4;
  --ink: #3a2314;
  --muted: #7a5a40;
  --accent: #a8691c;
  --accent-ink: #fff8ea;
  --floor: #e3cba6;
  --wall: #5a3a24;
  --line: #cfb48c;
}
html, body { height: 100%; margin: 0; padding: 0; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: Georgia, serif;
  line-height: 1.5;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  overflow: hidden;
}

/* Pantallas superpuestas */
.screen-view {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  text-align: center;
  background: var(--bg);
  z-index: 50;
}
#start-screen { background: radial-gradient(circle at center, var(--panel) 0%, var(--bg) 100%); z-index: 60; }
#intro-screen { background: #140a04; z-index: 70; }

.title-card {
  background: var(--panel);
  border: 3px solid var(--accent);
  border-radius: 16px;
  padding: 32px 24px;
  max-width: 520px;
  width: 100%;
  box-shadow: 0 12px 40px rgba(0,0,0,0.3);
}
h1.main-title { font-size: 26px; margin: 0 0 12px; color: var(--accent); }
p.subtitle { font-size: 16px; color: var(--muted); margin: 0 0 24px; }

.video-wrapper {
  max-width: 640px;
  width: 100%;
  border-radius: 12px;
  overflow: hidden;
  border: 3px solid var(--accent);
  background: #000;
  margin-bottom: 20px;
}
.video-wrapper video { width: 100%; height: auto; display: block; }

/* Contenedor del Juego */
#game-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  max-width: 720px;
  padding: 10px;
}

header {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
}
h1.game-head { font-size: 20px; margin: 0; }
.hud { display: flex; gap: 10px; align-items: center; font-size: 15px; }
.chip { background: var(--panel); border: 2px solid var(--line); border-radius: 999px; padding: 3px 12px; font-weight: 700; }
button { font: inherit; cursor: pointer; color: inherit; }
.btn {
  background: var(--accent);
  color: var(--accent-ink);
  border: 0;
  border-radius: 10px;
  padding: 12px 24px;
  font-weight: 700;
  font-size: 16px;
}

canvas {
  border: 3px solid var(--wall);
  border-radius: 8px;
  background: var(--floor);
  touch-action: none;
  max-width: 100%;
  display: block;
}
#msg { margin: 6px 0 0; color: var(--muted); font-size: 15px; text-align: center; min-height: 22px; }

.pad {
  display: none;
  grid-template-columns: repeat(3,56px);
  grid-template-rows: repeat(2,56px);
  gap: 6px;
  margin-top: 6px;
}
.pad button { background: var(--panel); border: 2px solid var(--line); border-radius: 12px; font-size: 22px; touch-action: none; }
.pad .u { grid-column: 2; }
@media (pointer:coarse){ .pad { display: grid; } }

/* Modales */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(20,10,4,.8);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 100;
}
.card {
  background: var(--panel);
  border: 3px solid var(--accent);
  border-radius: 16px;
  max-width: 520px;
  width: 100%;
  padding: 22px;
  max-height: 92vh;
  overflow: auto;
}
.tag { font-weight: 700; color: var(--accent); margin-bottom: 8px; }
.card p { margin: 0 0 16px; font-size: 18px; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; gap: 12px; text-align: left; background: transparent; border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px; align-items: center; }
.opt b { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.bad .tag { color: #d0533d; }
.extra { border: 2px dashed var(--accent); border-radius: 12px; padding: 14px; margin: 0 0 16px; text-align: center; }
.qr { display: inline-block; background: #fff; padding: 10px; border-radius: 8px; }
</style>
</head>

<!-- 1. Portada -->
<div id="start-screen" class="screen-view">
  <div class="title-card">
    <div style="font-size: 40px; margin-bottom: 8px;">☕</div>
    <h1 class="main-title">Elige tu propia aventura:<br>sobreviví al algoritmo</h1>
    <p class="subtitle">Defendé la tradición de tu cafetería frente a las demandas de las redes sociales.</p>
    <button class="btn" id="start-btn">Comenzar Aventura ➔</button>
  </div>
</div>

<!-- 2. Video Cutscene -->
<div id="intro-screen" class="screen-view" style="display: none;">
  <div class="video-wrapper">
    <video id="intro-video" autoplay muted loop playsinline controls>
      <source src="intro_cutscenecoffee.mp4" type="video/mp4">
      Tu navegador no soporta reproducción de video.
    </video>
  </div>
  <button class="btn" id="play-game-btn">Saltar e ir al juego ➔</button>
</div>

<!-- 3. Juego de Laberinto -->
<div id="game-container">
  <header>
    <h1 class="game-head">☕ Laberinto del café</h1>
    <div class="hud">
      <span class="chip" id="hud">Granos 0/4</span>
      <button class="btn" id="restart" style="padding: 4px 12px; font-size: 14px;">Reiniciar</button>
    </div>
  </header>

  <canvas id="cv" aria-label="Laberinto interactivo"></canvas>
  <p id="msg" aria-live="polite"></p>

  <div class="pad" aria-hidden="true">
    <button class="u" data-d="0">▲</button>
    <button data-d="3" style="grid-row:2;grid-column:1">◀</button>
    <button data-d="2" style="grid-row:2;grid-column:2">▼</button>
    <button data-d="1" style="grid-row:2;grid-column:3">▶</button>
  </div>
</div>

<!-- Modal de Decisiones -->
<div class="overlay" id="modal" hidden>
  <div class="card">
    <div class="tag" id="mtag"></div>
    <p id="mq"></p>
    <div id="mextra"></div>
    <div class="opts" id="mopts"></div>
  </div>
</div>
